
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support | Prove Talentbridge</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<header><h2>PROVE <span>TALENTBRIDGE</span></h2></header>
<main class="container">
  <h1>Help and Support</h1>
  <p>Send our support team a message about your account or project.</p>
  <form id="supportForm">
    <label for="supportEmail">Email Address</label>
    <input type="email" id="supportEmail" name="email" required>
    <label for="supportSubject">Subject</label>
    <input type="text" id="supportSubject" name="subject" required>
    <label for="supportMessage">Message</label>
    <textarea id="supportMessage" name="message" required></textarea>
    <button type="submit">Send Support Request</button>
    <p id="supportStatus" role="status"></p>
  </form>
</main>
<script src="../js/supabase.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
