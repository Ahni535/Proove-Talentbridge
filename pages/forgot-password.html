<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Prove Talentbridge</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="site-header">
<a class="brand" href="../index.html">PROVE <span>TALENTBRIDGE</span></a>
<a href="login.html">Login</a>
</header>

<main class="section">
<span class="eyebrow">ACCOUNT RECOVERY</span>
<h1>Forgot Your Password?</h1>
<p>Enter your registered email address to request a password reset.</p>

<form id="forgotPasswordForm">
<label for="resetEmail">Email Address</label>
<input id="resetEmail" name="email" type="email" autocomplete="email" required>

<button type="submit">Send Reset Link</button>
<p id="resetMessage" role="status"></p>
</form>

<form id="passwordUpdateForm" hidden>
<label for="newPassword">New Password</label>
<input id="newPassword" name="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirmNewPassword">Confirm New Password</label>
<input id="confirmNewPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
<button type="submit">Update Password</button>
<p id="passwordUpdateMessage" role="status"></p>
</form>

<p><a href="login.html">Return to Login</a></p>
</main>
<script src="../js/supabase.js"></script>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
