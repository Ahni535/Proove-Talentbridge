
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Prove Talentbridge</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<header><h2>PROVE <span>TALENTBRIDGE</span></h2></header>
<main class="container">
  <h1>Welcome Back</h1>
  <p>Sign in to continue to your account.</p>
  <form id="loginForm">
    <label for="loginEmail">Email Address</label>
    <input type="email" id="loginEmail" name="email" autocomplete="email" required>
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
    <button type="submit">Login</button>
    <p id="loginMessage" role="status"></p>
  </form>
  <p><a href="forgot-password.html">Forgot password?</a></p>
  <p>New here? <a href="register.html">Create an account</a></p>
</main>
<script src="../js/supabase.js"></script>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
